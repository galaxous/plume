name: plume-docker-lite

x-app-root: &app_root ${PLUME_APP_ROOT:-./}:/var/www/html

x-php-fpm-common: &php_fpm_common
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - *app_root
  networks:
    - plume

services:
  workspace:
    image: ${PLUME_DOCKER_LITE_WORKSPACE_IMAGE:-composer:${PLUME_COMPOSER_VERSION:-2}}
    build:
      context: ./workspace
      dockerfile: Dockerfile
      args:
        COMPOSER_VERSION: ${PLUME_COMPOSER_VERSION:-2}
        LARADOCK_PHP_VERSION: ${PLUME_PHP_DEFAULT_VERSION:-${PLUME_PHP_VERSION:-8.3}}
        WORKSPACE_USER: ${WORKSPACE_USER:-plume}
        WORKSPACE_PUID: ${WORKSPACE_PUID:-1000}
        WORKSPACE_PGID: ${WORKSPACE_PGID:-1000}
        WORKSPACE_TIMEZONE: ${WORKSPACE_TIMEZONE:-UTC}
        PLUME_PHP_DEFAULT_VERSION: ${PLUME_PHP_DEFAULT_VERSION:-8.3}
        PLUME_PHP_INSTALLED_VERSIONS: ${PLUME_PHP_INSTALLED_VERSIONS:-8.3}
        WORKSPACE_INSTALL_ZSH: ${WORKSPACE_INSTALL_ZSH:-false}
        WORKSPACE_INSTALL_OH_MY_ZSH: ${WORKSPACE_INSTALL_OH_MY_ZSH:-false}
        WORKSPACE_INSTALL_NODE: ${WORKSPACE_INSTALL_NODE:-false}
        WORKSPACE_NODE_VERSION: ${WORKSPACE_NODE_VERSION:-20}
        WORKSPACE_NPM_REGISTRY: ${WORKSPACE_NPM_REGISTRY:-}
        WORKSPACE_NVM_NODEJS_ORG_MIRROR: ${WORKSPACE_NVM_NODEJS_ORG_MIRROR:-}
    container_name: ${PLUME_PROJECT_NAME:-plume}-workspace
    tty: true
    stdin_open: true
    working_dir: /var/www/html
    command: ["/bin/sh", "-lc", "tail -f /dev/null"]
    volumes:
      - *app_root
    networks:
      - plume
    profiles: ["core"]

  # PHP-FPM clones use one shared build context + version arg
  php-fpm:
    <<: *php_fpm_common
    image: ${PLUME_DOCKER_LITE_PHP_FPM_IMAGE:-php:${PLUME_PHP_DEFAULT_VERSION:-${PLUME_PHP_VERSION:-8.3}}-fpm-alpine}
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PLUME_PHP_DEFAULT_VERSION:-${PLUME_PHP_VERSION:-8.3}}
    container_name: ${PLUME_PROJECT_NAME:-plume}-php-fpm
    profiles: ["core"]

  php81-fpm:
    <<: *php_fpm_common
    image: ${PLUME_DOCKER_LITE_PHP81_IMAGE:-php:${PLUME_PHP_ALIAS_PHP81:-8.1}-fpm-alpine}
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PLUME_PHP_ALIAS_PHP81:-8.1}
    container_name: ${PLUME_PROJECT_NAME:-plume}-php81-fpm
    profiles: ["php81"]

  php82-fpm:
    <<: *php_fpm_common
    image: ${PLUME_DOCKER_LITE_PHP82_IMAGE:-php:${PLUME_PHP_ALIAS_PHP82:-8.2}-fpm-alpine}
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PLUME_PHP_ALIAS_PHP82:-8.2}
    container_name: ${PLUME_PROJECT_NAME:-plume}-php82-fpm
    profiles: ["php82"]

  php83-fpm:
    <<: *php_fpm_common
    image: ${PLUME_DOCKER_LITE_PHP83_IMAGE:-php:${PLUME_PHP_ALIAS_PHP83:-8.3}-fpm-alpine}
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PLUME_PHP_ALIAS_PHP83:-8.3}
    container_name: ${PLUME_PROJECT_NAME:-plume}-php83-fpm
    profiles: ["php83"]

  php84-fpm:
    <<: *php_fpm_common
    image: ${PLUME_DOCKER_LITE_PHP84_IMAGE:-php:${PLUME_PHP_ALIAS_PHP84:-8.4}-fpm-alpine}
    build:
      context: ./php-fpm
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PLUME_PHP_ALIAS_PHP84:-8.4}
    container_name: ${PLUME_PROJECT_NAME:-plume}-php84-fpm
    profiles: ["php84"]

  nginx:
    image: ${PLUME_DOCKER_LITE_NGINX_IMAGE:-nginx:${PLUME_WEB_SERVER_VERSION:-stable}-alpine}
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${PLUME_WEB_SERVER_VERSION:-stable}-alpine
    container_name: ${PLUME_PROJECT_NAME:-plume}-nginx
    restart: unless-stopped
    depends_on:
      - php-fpm
    ports:
      - "${PLUME_NGINX_HTTP_PORT:-${PLUME_WEB_PORT:-80}}:80"
      - "${PLUME_NGINX_HTTPS_PORT:-${PLUME_WEB_HTTPS_PORT:-443}}:443"
    volumes:
      - *app_root
      - ${PLUME_DOCKER_LITE_NGINX_CONF:-./conf/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - plume
    profiles: ["web-nginx", "core"]

  apache2:
    image: ${PLUME_DOCKER_LITE_APACHE_IMAGE:-httpd:${PLUME_WEB_SERVER_VERSION:-2.4}-alpine}
    build:
      context: ./apache2
      dockerfile: Dockerfile
      args:
        APACHE_VERSION: ${PLUME_WEB_SERVER_VERSION:-2.4}-alpine
    container_name: ${PLUME_PROJECT_NAME:-plume}-apache2
    restart: unless-stopped
    depends_on:
      - php-fpm
    ports:
      - "${PLUME_APACHE_HTTP_PORT:-${PLUME_WEB_PORT:-80}}:80"
      - "${PLUME_APACHE_HTTPS_PORT:-${PLUME_WEB_HTTPS_PORT:-443}}:443"
    volumes:
      - *app_root
      - ${PLUME_DOCKER_LITE_APACHE_CONF:-./conf/apache2.conf}:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - plume
    profiles: ["web-apache2"]

  caddy:
    image: ${PLUME_DOCKER_LITE_CADDY_IMAGE:-caddy:${PLUME_WEB_SERVER_VERSION:-2}-alpine}
    build:
      context: ./caddy
      dockerfile: Dockerfile
      args:
        CADDY_VERSION: ${PLUME_WEB_SERVER_VERSION:-2}-alpine
    container_name: ${PLUME_PROJECT_NAME:-plume}-caddy
    restart: unless-stopped
    depends_on:
      - php-fpm
    ports:
      - "${PLUME_CADDY_HTTP_PORT:-${PLUME_WEB_PORT:-80}}:80"
      - "${PLUME_CADDY_HTTPS_PORT:-${PLUME_WEB_HTTPS_PORT:-443}}:443"
    volumes:
      - *app_root
      - ${PLUME_DOCKER_LITE_CADDYFILE:-./conf/Caddyfile}:/etc/caddy/Caddyfile:ro
    networks:
      - plume
    profiles: ["web-caddy"]

  mariadb:
    image: ${PLUME_DOCKER_LITE_MARIADB_IMAGE:-mariadb:${PLUME_MARIADB_VERSION:-11.0}}
    build:
      context: ./mariadb
      dockerfile: Dockerfile
      args:
        MARIADB_VERSION: ${PLUME_MARIADB_VERSION:-11.0}
    container_name: ${PLUME_PROJECT_NAME:-plume}-mariadb
    restart: unless-stopped
    environment:
      TZ: ${MARIADB_TIMEZONE:-${WORKSPACE_TIMEZONE:-UTC}}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${PLUME_DB_ROOT_PASSWORD:-root}}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-${PLUME_DB_DATABASE:-plume}}
      MARIADB_USER: ${MARIADB_USER:-${PLUME_DB_USERNAME:-plume}}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-${PLUME_DB_PASSWORD:-plume}}
    ports:
      - "${PLUME_MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - plume
    profiles: ["db-mariadb", "core"]

  mysql:
    image: ${PLUME_DOCKER_LITE_MYSQL_IMAGE:-mysql:${PLUME_MYSQL_VERSION:-8.0}}
    build:
      context: ./mysql
      dockerfile: Dockerfile
      args:
        MYSQL_VERSION: ${PLUME_MYSQL_VERSION:-8.0}
    container_name: ${PLUME_PROJECT_NAME:-plume}-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      TZ: ${MYSQL_TIMEZONE:-${WORKSPACE_TIMEZONE:-UTC}}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-no}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${PLUME_DB_ROOT_PASSWORD:-root}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-${PLUME_DB_DATABASE:-plume}}
      MYSQL_USER: ${MYSQL_USER:-${PLUME_DB_USERNAME:-plume}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${PLUME_DB_PASSWORD:-plume}}
    ports:
      - "${PLUME_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - plume
    profiles: ["db-mysql"]

  phpmyadmin:
    image: ${PLUME_DOCKER_LITE_PHPMYADMIN_IMAGE:-phpmyadmin/phpmyadmin:${PLUME_PHPMYADMIN_VERSION:-latest}}
    build:
      context: ./phpmyadmin
      dockerfile: Dockerfile
      args:
        PHPMYADMIN_VERSION: ${PLUME_PHPMYADMIN_VERSION:-latest}
    container_name: ${PLUME_PROJECT_NAME:-plume}-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_ARBITRARY: ${PMA_ARBITRARY:-1}
      PMA_HOST: ${PMA_HOST:-${PMA_DB_ENGINE:-${PMA_ENGINE:-mariadb}}}
      PMA_PORT: ${PMA_DB_PORT:-3306}
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-}
      PMA_USER: ${PMA_USER:-default}
      PMA_PASSWORD: ${PMA_PASSWORD:-secret}
      PMA_ROOT_PASSWORD: ${PMA_ROOT_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${PLUME_DB_ROOT_PASSWORD:-root}}
      MAX_EXECUTION_TIME: ${PMA_MAX_EXECUTION_TIME:-600}
      MEMORY_LIMIT: ${PMA_MEMORY_LIMIT:-256M}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-2G}
    ports:
      - "${PMA_PORT:-${PLUME_PHPMYADMIN_PORT:-8081}}:80"
    depends_on:
      - mariadb
      - mysql
    networks:
      - plume
    profiles: ["tooling-phpmyadmin"]

  postgres:
    image: ${PLUME_DOCKER_LITE_POSTGRES_IMAGE:-postgres:${PLUME_POSTGRES_VERSION:-16}-alpine}
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_TAG: ${PLUME_POSTGRES_VERSION:-16}-alpine
    container_name: ${PLUME_PROJECT_NAME:-plume}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLUME_DB_DATABASE:-plume}
      POSTGRES_USER: ${PLUME_DB_USERNAME:-plume}
      POSTGRES_PASSWORD: ${PLUME_DB_PASSWORD:-plume}
    ports:
      - "${PLUME_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plume
    profiles: ["db-postgres"]

  redis:
    image: ${PLUME_DOCKER_LITE_REDIS_IMAGE:-redis:${PLUME_REDIS_VERSION:-7}-alpine}
    build:
      context: ./redis
      dockerfile: Dockerfile
      args:
        REDIS_TAG: ${PLUME_REDIS_VERSION:-7}-alpine
    container_name: ${PLUME_PROJECT_NAME:-plume}-redis
    restart: unless-stopped
    ports:
      - "${PLUME_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - plume
    profiles: ["cache-redis"]

  laravel-horizon:
    image: ${PLUME_DOCKER_LITE_HORIZON_IMAGE:-laradock/laravel-horizon:latest}
    build:
      context: ./laravel-horizon
      dockerfile: Dockerfile
      args:
        HORIZON_IMAGE: ${PLUME_DOCKER_LITE_HORIZON_IMAGE:-laradock/laravel-horizon:latest}
    container_name: ${PLUME_PROJECT_NAME:-plume}-laravel-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - *app_root
    depends_on:
      - redis
    networks:
      - plume
    profiles: ["queue-horizon"]

networks:
  plume:
    driver: bridge

volumes:
  mariadb_data:
  mysql_data:
  postgres_data:
  redis_data:
